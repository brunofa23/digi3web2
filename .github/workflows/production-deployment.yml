name: Build and deploy (main → main-production)
concurrency: deploy_main_to_prod

on:
  push:
    branches:
      - main

permissions:
  contents: write  # necessário para dar push

jobs:
  build:
    name: Build AdonisJS e publicar em main-production
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout do código que acabou de ser enviado para a main
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 2️⃣ Node
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Git básico
      - name: Setup Git
        run: |
          git config --global user.email "brunofa23@gmail.com"
          git config --global user.name "Bruno Favato"
          git fetch origin

      # 4️⃣ Preparar main-production com o conteúdo da main que disparou o job
      - name: Prepare main-production
        run: |
          git fetch origin main main-production
          git checkout --detach origin/main-production
          git merge --no-edit origin/main || {
            conflicts="$(git diff --name-only --diff-filter=U)"

            if [ "$conflicts" = "_build/.adonisrc.json" ]; then
              git checkout --theirs _build/.adonisrc.json
              git add _build/.adonisrc.json
              git commit --no-edit
            else
              echo "Merge conflicts:"
              echo "$conflicts"
              exit 1
            fi
          }

      # 5️⃣ Build do Adonis e cópias necessárias
      - name: Build Adonis
        run: |
          npm ci
          node ace build --production --ignore-ts-errors
          mkdir -p _build/app/Services/Validations
          mkdir -p _build/scripts
          cp -fR tmp _build || true
          cp -f app/Services/Validations/listMessage.json _build/app/Services/Validations/listMessage.json || true
          cp -f scripts/write-google-credentials.js _build/scripts/write-google-credentials.js || true

      # 6️⃣ Commit de build e push do HEAD para main-production
      - name: Commit e push para main-production (forçando com segurança)
        run: |
          git checkout --detach
          git add -A
          git commit -m "chore(build): publish from ${GITHUB_SHA} [skip ci]" || echo "No changes to commit"

          git push origin HEAD:main-production
